name: CI

# Проверка каждой ветки: линтер, разметка, юнит-тесты, сборка.
# [TS7] шаг typecheck (vue-tsc) удалён: vue-tsc несовместим с TypeScript 7
# (require.resolve('typescript/lib/tsc') — в нативном Go-порте lib/tsc нет).
# Матрица Node 22/24 — проект поддерживает оба LTS-канала.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Версия pnpm читается из packageManager в package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Oxlint (быстрый JS/TS линтер)
        run: pnpm exec oxlint

      - name: Knip (мёртвый код и лишние зависимости)
        run: pnpm knip

      - name: Oxfmt (формат кода)
        run: pnpm fmt:check

      - name: Markuplint (шаблоны .vue/pug)
        run: pnpm lint:markup

      - name: Юнит-тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build

  deploy:
    # Авто-деплой в прод из main после зелёной проверки.
    # Секрет CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers»).
    # Пока секрет не задан, шаг деплоя молча пропускается —
    # CI остаётся зелёным, деплой делается вручную.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Деплой на Cloudflare Workers
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
